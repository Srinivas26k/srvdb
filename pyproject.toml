[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "srvdb"
version = "0.2.0"
description = "Embedded vector database for local and offline AI applications"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Srinivas Nampalli", email = "srinivasvarma764@gmail.com" },
]
license = { file = "LICENSE" }
keywords = ["vector", "database", "embedding", "search", "quantization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
# Only the benchmark scripts (benchmarks/) use these; the library does not
bench = [
    "numpy>=1.24.4",
    "psutil>=7.2.0",
    "scikit-learn>=1.3.2",
]

[project.urls]
Homepage = "https://github.com/Srinivas26k/srvdb"
Repository = "https://github.com/Srinivas26k/srvdb"
Documentation = "https://github.com/Srinivas26k/srvdb/blob/master/README.md"

[tool.maturin]
manifest-path = "crates/srvdb-py/Cargo.toml"
python-source = "python"
module-name = "srvdb._low_level"

[dependency-groups]
dev = [
    "maturin>=1.10.2",
]

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["python", "tests/python", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "EXE"]

[tool.ruff.lint.isort]
known-first-party = ["srvdb"]
