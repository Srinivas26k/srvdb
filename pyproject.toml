[build-system]
requires = ["maturin>=1.9"]
build-backend = "maturin"

[project]
name = "srvdb"
version = "0.3.0"
description = "SrvDB: embedded vector database for local and offline AI (RAG, semantic search). Crash-safe, no server, Rust core."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Srinivas Nampalli", email = "srinivasvarma764@gmail.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "vector-database", "vector-search", "embedded-database", "embeddings",
    "semantic-search", "rag", "local-ai", "offline", "hnsw", "quantization",
    "llm", "ai-memory", "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
# Only the benchmark scripts (benchmarks/) use these; the library does not
bench = [
    "numpy>=2.2.6",
    "psutil>=7.2.0",
    "scikit-learn>=1.3.2",
]

[project.urls]
Homepage = "https://github.com/Srinivas26k/srvdb"
Repository = "https://github.com/Srinivas26k/srvdb"
Documentation = "https://github.com/Srinivas26k/srvdb/blob/master/README.md"

[tool.maturin]
manifest-path = "crates/srvdb-py/Cargo.toml"
python-source = "python"
module-name = "srvdb._low_level"

[dependency-groups]
dev = [
    "maturin>=1.10.2",
]

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["python", "tests/python", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "EXE"]

[tool.ruff.lint.isort]
known-first-party = ["srvdb"]
