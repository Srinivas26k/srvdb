name: Documentation
description: Report a mistake, a gap or an outdated example in the docs
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: URL of the website page, or path of the file in the repository.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Quote the text or code snippet if possible.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
