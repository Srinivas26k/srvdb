name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems: please follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. Do not include private data.
      render: python
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or traceback
      render: text
  - type: input
    id: version
    attributes:
      label: SrvDB version
      placeholder: "python -c 'import srvdb; print(srvdb.__version__)'"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, CPU, Python or Rust version"
    validations:
      required: true
