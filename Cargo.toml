[workspace]
members = ["crates/srvdb", "crates/srvdb-py"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Srinivas Nampalli"]
license = "AGPL-3.0-only"
repository = "https://github.com/Srinivas26k/srvdb"

[workspace.dependencies]
srvdb = { path = "crates/srvdb" }
anyhow = "1.0"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.bench]
inherits = "release"

# Tests run optimised: PQ and k-means training is very slow unoptimised
[profile.test]
opt-level = 2
