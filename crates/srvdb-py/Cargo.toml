[package]
name = "srvdb-py"
description = "Python bindings for the SrvDB embedded vector database"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_low_level"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.30", features = ["multiple-pymethods"] }
rustc-hash = "2.0"
serde_json.workspace = true
srvdb.workspace = true

[features]
# Leaves libpython symbols unresolved, as a Python extension needs. maturin
# enables it (pyproject.toml); plain cargo builds keep it off so that
# `cargo build --workspace --all-targets` can link the lib-test target.
default = []
extension-module = ["pyo3/extension-module"]
# One wheel per platform for every CPython >= 3.9 (stable ABI)
abi3 = ["pyo3/abi3-py39"]
