[package]
name = "srvdb-py"
description = "Python bindings for the SrvDB embedded vector database"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_low_level"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods"] }
rustc-hash = "2.0"
serde_json.workspace = true
srvdb.workspace = true
